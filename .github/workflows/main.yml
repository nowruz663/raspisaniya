name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspisaniya_app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get --no-example || flutter pub get

      - name: Build APK (Bütin bökdençlikleri döwüp geçmek)
        run: flutter build apk --release --no-sound-null-safety --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: raspisaniya_app/build/app/outputs/flutter-apk/app-release.apk
